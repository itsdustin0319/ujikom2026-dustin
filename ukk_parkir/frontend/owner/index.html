<!DOCTYPE html>
<!-- Deklarasi tipe dokumen HTML5 — wajib di baris pertama -->
<html lang="id">
<!-- lang="id" = bahasa dokumen Bahasa Indonesia -->

<head>
    <meta charset="UTF-8">
    <!-- charset UTF-8: encoding karakter universal agar semua teks tampil benar -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- viewport meta: mengatur tampilan agar responsif di perangkat mobile
         initial-scale=1.0: zoom awal = 100% (tidak diperbesar/dikecilkan) -->
    <title>E-Parking Owner - Laporan Pendapatan</title>

    <!-- jsPDF: library JavaScript untuk membuat dan mengunduh file PDF langsung dari browser
         Diunduh dari CDN (Content Delivery Network) — tidak perlu install di komputer -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- jsPDF AutoTable: plugin tambahan untuk jsPDF agar bisa membuat tabel otomatis di dalam PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        /* ======================================================
           CSS SECTION
           Halaman Owner: Laporan Pendapatan Parkir
           Tema: Frutiger Aero dengan animasi background bergerak
           ====================================================== */

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            /* Font modern bersih */
            /* Background gradasi 3 warna — akan dianimasikan agar bergerak */
            background: linear-gradient(135deg, #00b4db, #0083b0, #2ecc71);
            background-size: 400% 400%;
            /* Ukuran background dibuat besar (400%) agar animasinya terasa */
            animation: gradientBG 15s ease infinite;
            /* Jalankan animasi gradientBG setiap 15 detik, berulang terus */
            min-height: 100vh;
            /* Tinggi minimal = tinggi layar */
            display: flex;
            /* Layout utama menggunakan Flexbox (sidebar kiri + konten kanan) */
        }

        /* Animasi pergerakan warna background
           Keyframes mendefinisikan status pada titik-titik tertentu (0%, 50%, 100%)
           background-position bergerak dari kiri ke kanan dan kembali → warna terasa "mengalir" */
        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
                /* Posisi awal: sisi kiri */
            }

            50% {
                background-position: 100% 50%;
                /* Posisi tengah: sisi kanan */
            }

            100% {
                background-position: 0% 50%;
                /* Kembali ke posisi awal */
            }
        }

        .sidebar {
            width: 250px;
            /* Lebar sidebar */
            background: rgba(255, 255, 255, 0.2);
            /* Semi-transparan 20% */
            backdrop-filter: blur(15px);
            /* Efek blur kaca di belakang sidebar */
            border-right: 1px solid rgba(255, 255, 255, 0.3);
            /* Garis tepi kanan tipis putih transparan */
            padding: 20px;
            /* Jarak dalam */
            display: flex;
            /* Pakai Flexbox agar tombol logout bisa didorong ke bawah */
            flex-direction: column;
            /* Susun elemen anak secara vertikal */
            color: white;
            /* Teks putih di sidebar */
        }
        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .card-glass {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            margin-bottom: 25px;
        }

        /* Warna judul */
        h1, h2, h3 { color: #004e92; text-shadow: 1px 1px white; }

        /* Tabel */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; border-radius: 10px; overflow: hidden; }
        th { background: #0083b0; color: white; padding: 12px; }
        td { padding: 12px; border-bottom: 1px solid #eee; text-align: center; }

        /* Tombol */
        .btn-logout {
            background: linear-gradient(to bottom, #ff5f6d, #ffc371);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            margin-top: auto;
        }
        .btn-action {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Input */
        .input-date { padding: 8px; border-radius: 5px; border: 1px solid #ddd; }

        /* Chart wrapper */
        .chart-wrapper {
            width: 100%;
            height: 300px;
            margin-top: 10px;
        }
    </style>
</head>
<!-- // Owner dashboard: view revenue reports and generate PDFs -->

<body>

    <!-- SIDEBAR NAVIGASI OWNER -->
    <div class="sidebar">
        <h2>E-PARKING Owner</h2>
        <!-- Garis pemisah tipis dengan warna putih transparan -->
        <hr style="width: 100%; border: 0.5px solid rgba(255,255,255,0.3);">
        <nav>
            <!-- Menu aktif (hanya ada 1 halaman untuk owner) -->
            <p style="background: rgba(255,255,255,0.3); padding: 10px; border-radius: 10px;"> Laporan Pendapatan</p>
        </nav>
        <!-- Tombol logout → memanggil fungsi handleLogout() saat diklik -->
        <button class="btn-logout" onclick="handleLogout()"> Logout</button>
    </div>

    <!-- AREA KONTEN UTAMA -->
    <div class="main-content">
        <!-- Kartu sambutan -->
        <div class="card-glass">
            <h1>Selamat Datang, Owner!</h1>
            <p>Pantau statistik pendapatan parkir Anda di sini.</p>
        </div>

        <!-- Dua kartu statistik pendapatan (grid 2 kolom) -->
        <!-- grid-template-columns: 1fr 1fr → dua kolom lebar sama -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px;">
            <!-- Kartu 1: Pendapatan Hari Ini -->
            <div class="card-glass" style="text-align: center;">
                <p> Pendapatan Hari Ini</p>
                <!-- id="stat-hari-ini" → isi diisi oleh JavaScript setelah data diambil dari server -->
                <h2 id="stat-hari-ini" style="color: #2ecc71;">Rp 0</h2>
            </div>
            <!-- Kartu 2: Pendapatan Bulan Ini -->
            <div class="card-glass" style="text-align: center;">
                <p> Pendapatan Bulan Ini</p>
                <!-- id="stat-bulan-ini" → akan diupdate oleh JavaScript -->
                <h2 id="stat-bulan-ini" style="color: #3498db;">Rp 0</h2>
            </div>
        </div>

        <!-- Kartu Filter & Tabel Riwayat Transaksi -->
        <div class="card-glass">
            <h3> Tren Pendapatan</h3>
            <div class="chart-wrapper">
                <canvas id="parkingChart"></canvas>
            </div>
        </div>

        <div class="card-glass">
            <h3> Rekap Transaksi</h3>
            <!-- Area filter tanggal: pilih rentang tanggal untuk melihat laporan spesifik -->
            <div style="display: flex; gap: 10px; align-items: flex-end; margin-bottom: 20px;">
                <div>
                    <label>Mulai:</label><br>
                    <!-- Input tanggal mulai filter. id="filter-start" diambil oleh JavaScript -->
                    <input type="date" id="filter-start" class="input-date">
                </div>
                <div>
                    <label>Sampai:</label><br>
                    <!-- Input tanggal akhir filter -->
                    <input type="date" id="filter-end" class="input-date">
                </div>
                <!-- Tombol untuk mengambil data sesuai rentang filter yang dipilih -->
                <button class="btn-action" onclick="loadData()">Cek Data</button>
                <!-- Tombol untuk mengunduh laporan dalam format PDF -->
                <button class="btn-action" style="background: #e67e22;" onclick="downloadPDF()"> Download PDF</button>
            </div>

            <!-- Kotak total pendapatan untuk rentang tanggal yang dipilih -->
            <div style="background: #e0f2fe; padding: 15px; border-radius: 10px; margin-bottom: 15px;">
                <b>Total Pendapatan Periode Ini: </b> <span id="stat-range" style="font-size: 1.2em;">Rp 0</span>
            </div>

            <!-- Tabel riwayat pendapatan 7 hari terakhir -->
            <table>
                <thead>
                    <tr>
                        <th>Tanggal</th>
                        <th>Jumlah Kendaraan</th>
                        <th>Total Pendapatan</th>
                    </tr>
                </thead>
                <!-- tbody kosong, akan diisi oleh JavaScript dengan data dari server -->
                <tbody id="list-history"></tbody>
            </table>
        </div>
    </div>

    <script>
        let myChart;

        // Format Rupiah yang rapi
        const formatter = new Intl.NumberFormat('id-ID', {
            style: 'currency',
            currency: 'IDR',
            minimumFractionDigits: 0
        });

        async function loadData() {
            const start = document.getElementById('filter-start').value;
            const end = document.getElementById('filter-end').value;
            const baseUrl = "http://localhost:3000";

            try {
                // 1. Ambil Statistik Ringkasan
                const resStat = await fetch(`${baseUrl}/api/owner/pendapatan?start=${start}&end=${end}`);
                const stat = await resStat.json();

                document.getElementById('stat-hari-ini').innerText = formatter.format(stat.hari_ini || 0);
                document.getElementById('stat-bulan-ini').innerText = formatter.format(stat.bulan_ini || 0);
                document.getElementById('stat-range').innerText = formatter.format(stat.total_range || 0);

                // 2. Ambil Data History (Untuk Grafik & Tabel)
                const resHist = await fetch(`${baseUrl}/api/owner/history?start=${start}&end=${end}`);
                let history = await resHist.json();

                if (Array.isArray(history) && history.length > 0) {
                    updateChart(history);
                    updateTable(history);
                } else {
                    document.getElementById('list-history').innerHTML = `<tr><td colspan="3" style="padding:20px; color:#666;">Data tidak ditemukan.</td></tr>`;
                    if (myChart) { myChart.destroy(); }
                }

            } catch (err) {
                console.error("Gagal terhubung ke server (CORS/Network Error):", err);
                document.getElementById('list-history').innerHTML = `<tr><td colspan="3" style="color:red">Gagal terhubung ke server (Cek koneksi/CORS)</td></tr>`;
            }
        }

        // FUNGSI ISI TABEL
        function updateTable(history) {
            const tbody = document.getElementById('list-history');
            const sorted = [...history].sort((a, b) => new Date(b.tanggal) - new Date(a.tanggal));

            tbody.innerHTML = sorted.map(h => `
                <tr>
                    <td>${new Date(h.tanggal).toLocaleDateString('id-ID', { timeZone: 'Asia/Jakarta', day:'numeric', month:'long', year:'numeric' })}</td>
                    <td>${h.jumlah_kendaraan} Unit</td>
                    <td><b>${formatter.format(h.pendapatan)}</b></td>
                </tr>
            `).join('');
        }

        // FUNGSI GAMBAR GRAFIK
        function updateChart(history) {
            const ctx = document.getElementById('parkingChart').getContext('2d');
            const chartData = [...history].sort((a, b) => new Date(a.tanggal) - new Date(b.tanggal));

            const labels = chartData.map(h => new Date(h.tanggal).toLocaleDateString('id-ID', { timeZone: 'Asia/Jakarta', day:'numeric', month:'short' }));
            const values = chartData.map(h => h.pendapatan);

            if (myChart) { myChart.destroy(); }

            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Pendapatan',
                        data: values,
                        backgroundColor: 'rgba(0, 131, 176, 0.7)',
                        borderColor: '#0083b0',
                        borderWidth: 1,
                        borderRadius: 5,
                        maxBarThickness: 45
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            min: 0,
                            max: 50000000,
                            ticks: {
                                stepSize: 10000000,
                                callback: (value) => 'Rp ' + (value/1000000) + 'jt'
                            }
                        },
                        x: {
                            grid: { display: false }
                        }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        // Fungsi Download PDF
        function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text("LAPORAN PENDAPATAN E-PARKING", 14, 15);
            doc.autoTable({ startY: 25, html: 'table', theme: 'grid', headStyles: { fillColor: [0, 131, 176] } });
            doc.save("Laporan_Owner.pdf");
        }

        // Fungsi Logout
        function handleLogout() {
            localStorage.clear();
            sessionStorage.clear();
            window.location.href = '../auth/login.html';
        }

        // Load data otomatis saat halaman dibuka
        window.onload = () => {
            const today = new Date(new Date().toLocaleString("en-US", {timeZone: "Asia/Jakarta"})).toISOString().split('T')[0];
            document.getElementById('filter-start').value = today;
            document.getElementById('filter-end').value = today;
            loadData();
        };
    </script>
</body>

</html>
