<!DOCTYPE html>
<!-- Deklarasi tipe dokumen HTML5 — wajib di baris pertama -->
<html lang="id">
<!-- lang="id" = bahasa dokumen Bahasa Indonesia -->

<head>
    <meta charset="UTF-8">
    <!-- charset UTF-8: encoding karakter universal agar semua teks tampil benar -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- viewport meta: mengatur tampilan agar responsif di perangkat mobile
         initial-scale=1.0: zoom awal = 100% (tidak diperbesar/dikecilkan) -->
    <title>E-Parking Owner - Laporan Pendapatan</title>

    <!-- jsPDF: library JavaScript untuk membuat dan mengunduh file PDF langsung dari browser
         Diunduh dari CDN (Content Delivery Network) — tidak perlu install di komputer -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- jsPDF AutoTable: plugin tambahan untuk jsPDF agar bisa membuat tabel otomatis di dalam PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>

    <style>
        /* ======================================================
           CSS SECTION
           Halaman Owner: Laporan Pendapatan Parkir
           Tema: Frutiger Aero dengan animasi background bergerak
           ====================================================== */

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            /* Font modern bersih */
            /* Background gradasi 3 warna — akan dianimasikan agar bergerak */
            background: linear-gradient(135deg, #00b4db, #0083b0, #2ecc71);
            background-size: 400% 400%;
            /* Ukuran background dibuat besar (400%) agar animasinya terasa */
            animation: gradientBG 15s ease infinite;
            /* Jalankan animasi gradientBG setiap 15 detik, berulang terus */
            min-height: 100vh;
            /* Tinggi minimal = tinggi layar */
            display: flex;
            /* Layout utama menggunakan Flexbox (sidebar kiri + konten kanan) */
        }

        /* Animasi pergerakan warna background
           Keyframes mendefinisikan status pada titik-titik tertentu (0%, 50%, 100%)
           background-position bergerak dari kiri ke kanan dan kembali → warna terasa "mengalir" */
        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
                /* Posisi awal: sisi kiri */
            }

            50% {
                background-position: 100% 50%;
                /* Posisi tengah: sisi kanan */
            }

            100% {
                background-position: 0% 50%;
                /* Kembali ke posisi awal */
            }
        }

        /* Sidebar Frutiger Aero — panel navigasi di sebelah kiri */
        .sidebar {
            width: 250px;
            /* Lebar sidebar */
            background: rgba(255, 255, 255, 0.2);
            /* Semi-transparan 20% */
            backdrop-filter: blur(15px);
            /* Efek blur kaca di belakang sidebar */
            border-right: 1px solid rgba(255, 255, 255, 0.3);
            /* Garis tepi kanan tipis putih transparan */
            padding: 20px;
            /* Jarak dalam */
            display: flex;
            /* Pakai Flexbox agar tombol logout bisa didorong ke bawah */
            flex-direction: column;
            /* Susun elemen anak secara vertikal */
            color: white;
            /* Teks putih di sidebar */
        }

        /* Area konten utama (di sebelah kanan sidebar) */
        .main-content {
            flex: 1;
            /* Mengambil sisa ruang yang ada (selain sidebar) */
            padding: 30px;
            /* Jarak dalam konten */
            overflow-y: auto;
            /* Jika konten panjang, tampilkan scrollbar vertikal */
        }

        /* Glassmorphism Card — kartu transparan dengan efek kaca
           Digunakan untuk membungkus setiap bagian konten */
        .card-glass {
            background: rgba(255, 255, 255, 0.8);
            /* Putih 80% transparan */
            backdrop-filter: blur(10px);
            /* Blur di belakang kartu */
            border-radius: 20px;
            /* Sudut melengkung */
            padding: 25px;
            /* Jarak dalam */
            border: 1px solid rgba(255, 255, 255, 0.5);
            /* Border kaca putih transparan */
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            /* Bayangan lembut → kartu terasa melayang */
            margin-bottom: 25px;
            /* Jarak bawah antar kartu */
        }

        /* Warna judul-judul (h1, h2, h3) */
        h1,
        h2,
        h3 {
            color: #004e92;
            /* Biru tua */
            text-shadow: 1px 1px white;
            /* Bayangan putih → teks lebih terbaca */
        }

        /* Styling tabel data riwayat transaksi */
        table {
            width: 100%;
            /* Lebar penuh mengisi kartu */
            border-collapse: collapse;
            /* Gabungkan border tabel (tidak ada jarak antar sel) */
            margin-top: 15px;
            background: white;
            /* Background tabel putih solid */
            border-radius: 10px;
            /* Sudut membulat */
            overflow: hidden;
            /* Sembunyikan konten yang melewati sudut melengkung */
        }

        /* Baris header tabel (kepala kolom) */
        th {
            background: #0083b0;
            /* Background biru tua untuk header */
            color: white;
            /* Teks putih */
            padding: 12px;
            /* Jarak dalam sel header */
        }

        /* Sel data tabel */
        td {
            padding: 12px;
            /* Jarak dalam sel */
            border-bottom: 1px solid #eee;
            /* Garis pemisah baris tipis */
            text-align: center;
            /* Rata tengah */
        }

        /* Tombol Logout di sidebar */
        .btn-logout {
            background: linear-gradient(to bottom, #ff5f6d, #ffc371);
            /* Gradasi merah-oranye (tanda bahaya/keluar) */
            color: white;
            border: none;
            padding: 12px;
            border-radius: 50px;
            /* Tombol berbentuk pil */
            cursor: pointer;
            font-weight: bold;
            margin-top: auto;
            /* Dorong ke paling bawah sidebar menggunakan flexbox */
        }

        /* Tombol aksi umum (Cek Data, Download PDF) */
        .btn-action {
            background: #2ecc71;
            /* Hijau → tanda aksi positif */
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Input tanggal (filter laporan) */
        .input-date {
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ddd;
            /* Border abu-abu tipis */
        }
    </style>
</head>
<!-- // Owner dashboard: view revenue reports and generate PDFs -->

<body>

    <!-- SIDEBAR NAVIGASI OWNER -->
    <div class="sidebar">
        <h2>E-PARKING Owner</h2>
        <!-- Garis pemisah tipis dengan warna putih transparan -->
        <hr style="width: 100%; border: 0.5px solid rgba(255,255,255,0.3);">
        <nav>
            <!-- Menu aktif (hanya ada 1 halaman untuk owner) -->
            <p style="background: rgba(255,255,255,0.3); padding: 10px; border-radius: 10px;">📊 Laporan Pendapatan</p>
        </nav>
        <!-- Tombol logout → memanggil fungsi handleLogout() saat diklik -->
        <button class="btn-logout" onclick="handleLogout()">🚪 Logout</button>
    </div>

    <!-- AREA KONTEN UTAMA -->
    <div class="main-content">
        <!-- Kartu sambutan -->
        <div class="card-glass">
            <h1>Selamat Datang, Owner!</h1>
            <p>Pantau statistik pendapatan parkir Anda di sini.</p>
        </div>

        <!-- Dua kartu statistik pendapatan (grid 2 kolom) -->
        <!-- grid-template-columns: 1fr 1fr → dua kolom lebar sama -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px;">
            <!-- Kartu 1: Pendapatan Hari Ini -->
            <div class="card-glass" style="text-align: center;">
                <p>💰 Pendapatan Hari Ini</p>
                <!-- id="stat-hari-ini" → isi diisi oleh JavaScript setelah data diambil dari server -->
                <h2 id="stat-hari-ini" style="color: #2ecc71;">Rp 0</h2>
            </div>
            <!-- Kartu 2: Pendapatan Bulan Ini -->
            <div class="card-glass" style="text-align: center;">
                <p>🗓️ Pendapatan Bulan Ini</p>
                <!-- id="stat-bulan-ini" → akan diupdate oleh JavaScript -->
                <h2 id="stat-bulan-ini" style="color: #3498db;">Rp 0</h2>
            </div>
        </div>

        <!-- Kartu Filter & Tabel Riwayat Transaksi -->
        <div class="card-glass">
            <h3>🔍 Rekap Transaksi</h3>
            <!-- Area filter tanggal: pilih rentang tanggal untuk melihat laporan spesifik -->
            <div style="display: flex; gap: 10px; align-items: flex-end; margin-bottom: 20px;">
                <div>
                    <label>Mulai:</label><br>
                    <!-- Input tanggal mulai filter. id="filter-start" diambil oleh JavaScript -->
                    <input type="date" id="filter-start" class="input-date">
                </div>
                <div>
                    <label>Sampai:</label><br>
                    <!-- Input tanggal akhir filter -->
                    <input type="date" id="filter-end" class="input-date">
                </div>
                <!-- Tombol untuk mengambil data sesuai rentang filter yang dipilih -->
                <button class="btn-action" onclick="loadData()">Cek Data</button>
                <!-- Tombol untuk mengunduh laporan dalam format PDF -->
                <button class="btn-action" style="background: #e67e22;" onclick="downloadPDF()">📥 Download PDF</button>
            </div>

            <!-- Kotak total pendapatan untuk rentang tanggal yang dipilih -->
            <div style="background: #e0f2fe; padding: 15px; border-radius: 10px; margin-bottom: 15px;">
                <b>Total Pendapatan Periode Ini: </b> <span id="stat-range" style="font-size: 1.2em;">Rp 0</span>
            </div>

            <!-- Tabel riwayat pendapatan 7 hari terakhir -->
            <table>
                <thead>
                    <tr>
                        <th>Tanggal</th>
                        <th>Jumlah Kendaraan</th>
                        <th>Total Pendapatan</th>
                    </tr>
                </thead>
                <!-- tbody kosong, akan diisi oleh JavaScript dengan data dari server -->
                <tbody id="list-history"></tbody>
            </table>
        </div>
    </div>

    <script>
        // ============================================================
        // FUNGSI: loadData()
        // Tujuan: Mengambil data pendapatan (statistik + riwayat) dari server
        //         dan menampilkannya di halaman
        //
        // Dipanggil saat: tombol "Cek Data" diklik, atau saat halaman pertama dibuka
        // ============================================================
        async function loadData() {
            // Ambil tanggal dari input filter; jika kosong, gunakan tanggal hari ini sebagai default
            // .toISOString().split('T')[0]: mengubah Date ke format "YYYY-MM-DD"
            const start = document.getElementById('filter-start').value || new Date().toISOString().split('T')[0];
            const end = document.getElementById('filter-end').value || new Date().toISOString().split('T')[0];

            try {
                // Ambil Statistik (pendapatan hari ini, bulan ini, dan rentang tanggal)
                // Template literal `${start}` → masukkan nilai variabel ke dalam string URL
                const resStat = await fetch(`http://localhost:3000/api/owner/pendapatan?start=${start}&end=${end}`);
                const stat = await resStat.json(); // Ubah response JSON jadi object JavaScript

                // Tampilkan data statistik ke elemen HTML yang sesuai
                // Number(...).toLocaleString('id-ID') → format angka ke format Indonesia: 1.500.000
                // || 0 → jika nilainya null/undefined, tampilkan 0 (menghindari error "Rp null")
                document.getElementById('stat-hari-ini').innerText = `Rp ${Number(stat.hari_ini || 0).toLocaleString('id-ID')}`;
                document.getElementById('stat-bulan-ini').innerText = `Rp ${Number(stat.bulan_ini || 0).toLocaleString('id-ID')}`;
                document.getElementById('stat-range').innerText = `Rp ${Number(stat.total_range || 0).toLocaleString('id-ID')}`;

                // Ambil Tabel History (riwayat 7 hari terakhir)
                const resHist = await fetch(`http://localhost:3000/api/owner/history`);
                const history = await resHist.json(); // Array of objects: [{tanggal, jumlah_kendaraan, pendapatan}, ...]
                const tbody = document.getElementById('list-history');

                // .map() → ubah setiap item data menjadi baris HTML (<tr>)
                // .join('') → gabungkan semua string HTML menjadi satu string tanpa pemisah
                tbody.innerHTML = history.map(h => `
                    <tr>
                        <!-- toLocaleDateString: format tanggal ke "12 Januari 2025" (format Indonesia) -->
                        <td>${new Date(h.tanggal).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' })}</td>
                        <td>${h.jumlah_kendaraan} Unit</td>
                        <td><b>Rp ${Number(h.pendapatan).toLocaleString('id-ID')}</b></td>
                    </tr>
                `).join('');
            } catch (err) { console.error("Error:", err); } // Tampilkan error di konsol browser (buka dengan F12)
        }

        // ============================================================
        // FUNGSI: downloadPDF()
        // Tujuan: Mengunduh laporan pendapatan dalam format PDF
        //         menggunakan library jsPDF yang sudah di-load di <head>
        // ============================================================
        function downloadPDF() {
            const { jsPDF } = window.jspdf; // Ambil class jsPDF dari library yang sudah diload
            const doc = new jsPDF();         // Buat dokumen PDF baru (default: ukuran A4 portrait)
            doc.text("LAPORAN PENDAPATAN E-PARKING", 14, 15); // Tulis judul: text, posisi X=14, posisi Y=15 (dalam mm)
            doc.autoTable({                  // Plugin autoTable: buat tabel otomatis dari elemen <table> di HTML
                startY: 25,                  // Tabel mulai dari Y=25mm (di bawah judul)
                html: 'table',               // Referensikan tabel HTML pertama di halaman
                theme: 'grid',               // Tema tabel 'grid' → ada garis kotak di setiap sel
                headStyles: { fillColor: [0, 131, 176] } // Warna header tabel: [R, G, B] → biru
            });
            doc.save("Laporan_Owner.pdf");   // Unduh file PDF dengan nama "Laporan_Owner.pdf"
        }

        // ============================================================
        // FUNGSI: handleLogout()
        // Tujuan: Keluar dari sesi Owner dan kembali ke halaman login
        //
        // Gunanya:
        //   - Hapus semua data sesi yang tersimpan di browser
        //   - Arahkan ke halaman login agar user login ulang
        // ============================================================
        function handleLogout() {
            // confirm(): menampilkan dialog konfirmasi "Ya/Tidak" → mencegah logout tidak sengaja
            if (!confirm("Apakah anda yakin ingin keluar?")) return; // Jika pilih "Tidak", hentikan fungsi di sini
            localStorage.clear();   // Hapus semua data di localStorage (id_user, username, role)
            sessionStorage.clear(); // Hapus semua data di sessionStorage (data sementara sesi browser)
            window.location.href = '../auth/login.html'; // Redirect ke halaman login
        }


        // Load data otomatis saat halaman dibuka (bukan hanya saat tombol diklik)
        // window.onload = fungsi yang dijalankan SETELAH semua elemen HTML selesai dimuat
        window.onload = loadData;
    </script>
</body>

</html>
