<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Parking Owner - Laporan Pendapatan</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #00b4db, #0083b0, #2ecc71);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            display: flex;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Sidebar Frutiger Aero */
        .sidebar {
            width: 250px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px);
            border-right: 1px solid rgba(255, 255, 255, 0.3);
            padding: 20px;
            display: flex;
            flex-direction: column;
            color: white;
        }

        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        /* Glassmorphism Card */
        .card-glass {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            margin-bottom: 25px;
        }

        h1, h2, h3 { color: #004e92; text-shadow: 1px 1px white; }

        /* Table Style */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; border-radius: 10px; overflow: hidden; }
        th { background: #0083b0; color: white; padding: 12px; }
        td { padding: 12px; border-bottom: 1px solid #eee; text-align: center; }

        /* Buttons */
        .btn-logout {
            background: linear-gradient(to bottom, #ff5f6d, #ffc371);
            color: white; border: none; padding: 12px; border-radius: 50px;
            cursor: pointer; font-weight: bold; margin-top: auto;
        }
        .btn-action {
            background: #2ecc71; color: white; border: none; padding: 10px 20px;
            border-radius: 8px; cursor: pointer; font-weight: bold;
        }
        .input-date { padding: 8px; border-radius: 5px; border: 1px solid #ddd; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>E-PARKING Owner</h2>
        <hr style="width: 100%; border: 0.5px solid rgba(255,255,255,0.3);">
        <nav>
            <p style="background: rgba(255,255,255,0.3); padding: 10px; border-radius: 10px;">📊 Laporan Pendapatan</p>
        </nav>
        <button class="btn-logout" onclick="handleLogout()">🚪 Logout</button>
    </div>

    <div class="main-content">
        <div class="card-glass">
            <h1>Selamat Datang, Owner!</h1>
            <p>Pantau statistik pendapatan parkir Anda di sini.</p>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px;">
            <div class="card-glass" style="text-align: center;">
                <p>💰 Pendapatan Hari Ini</p>
                <h2 id="stat-hari-ini" style="color: #2ecc71;">Rp 0</h2>
            </div>
            <div class="card-glass" style="text-align: center;">
                <p>🗓️ Pendapatan Bulan Ini</p>
                <h2 id="stat-bulan-ini" style="color: #3498db;">Rp 0</h2>
            </div>
        </div>

        <div class="card-glass">
            <h3>🔍 Rekap Transaksi</h3>
            <div style="display: flex; gap: 10px; align-items: flex-end; margin-bottom: 20px;">
                <div>
                    <label>Mulai:</label><br>
                    <input type="date" id="filter-start" class="input-date">
                </div>
                <div>
                    <label>Sampai:</label><br>
                    <input type="date" id="filter-end" class="input-date">
                </div>
                <button class="btn-action" onclick="loadData()">Cek Data</button>
                <button class="btn-action" style="background: #e67e22;" onclick="downloadPDF()">📥 Download PDF</button>
            </div>

            <div style="background: #e0f2fe; padding: 15px; border-radius: 10px; margin-bottom: 15px;">
                <b>Total Pendapatan Periode Ini: </b> <span id="stat-range" style="font-size: 1.2em;">Rp 0</span>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Tanggal</th>
                        <th>Jumlah Kendaraan</th>
                        <th>Total Pendapatan</th>
                    </tr>
                </thead>
                <tbody id="list-history"></tbody>
            </table>
        </div>
    </div>

    <script>
        async function loadData() {
            const start = document.getElementById('filter-start').value || new Date().toISOString().split('T')[0];
            const end = document.getElementById('filter-end').value || new Date().toISOString().split('T')[0];

            try {
                // Ambil Statistik
                const resStat = await fetch(`http://localhost:3000/api/owner/pendapatan?start=${start}&end=${end}`);
                const stat = await resStat.json();
                document.getElementById('stat-hari-ini').innerText = `Rp ${Number(stat.hari_ini || 0).toLocaleString('id-ID')}`;
                document.getElementById('stat-bulan-ini').innerText = `Rp ${Number(stat.bulan_ini || 0).toLocaleString('id-ID')}`;
                document.getElementById('stat-range').innerText = `Rp ${Number(stat.total_range || 0).toLocaleString('id-ID')}`;

                // Ambil Tabel History
                const resHist = await fetch(`http://localhost:3000/api/owner/history`);
                const history = await resHist.json();
                const tbody = document.getElementById('list-history');
                tbody.innerHTML = history.map(h => `
                    <tr>
                        <td>${new Date(h.tanggal).toLocaleDateString('id-ID', {day:'numeric', month:'long', year:'numeric'})}</td>
                        <td>${h.jumlah_kendaraan} Unit</td>
                        <td><b>Rp ${Number(h.pendapatan).toLocaleString('id-ID')}</b></td>
                    </tr>
                `).join('');
            } catch (err) { console.error("Error:", err); }
        }

        function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text("LAPORAN PENDAPATAN E-PARKING", 14, 15);
            doc.autoTable({
                startY: 25,
                html: 'table',
                theme: 'grid',
                headStyles: { fillColor: [0, 131, 176] }
            });
            doc.save("Laporan_Owner.pdf");
        }

     function handleLogout() {
    // Menampilkan konfirmasi seperti di video Anda
   
        // Menghapus session agar tidak bisa back kembali setelah logout
        localStorage.clear();
        sessionStorage.clear();
        
        // Disamakan persis dengan rute di admin.html Anda
        window.location.href = '../auth/login.html';
    }


        // Load data otomatis saat dibuka
        window.onload = loadData;
    </script>
</body>
</html>
